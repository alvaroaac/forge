<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forge — Engineering Command Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="forge/styles.css?v=4" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root" data-screen-label="Forge — Dashboard"></div>

  <!-- Data + JSX modules -->
  <script src="forge/data.js"></script>
  <script type="text/babel" src="forge/icons.jsx"></script>
  <script type="text/babel" src="forge/drawer.jsx"></script>
  <script type="text/babel" src="forge/dashboard.jsx"></script>
  <script type="text/babel" src="forge/tweaks-panel.jsx"></script>

  <script type="text/babel">
    const { useEffect, useMemo } = React;

    // Tweak defaults — host-rewritable via __edit_mode_set_keys
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#7180F5",
      "showDrawer": false,
      "initialTab": "Todo"
    }/*EDITMODE-END*/;

    const ACCENTS = {
      indigo: {
        base: "#7180F5", dim: "#4756B8",
        soft: "rgba(113, 128, 245, 0.12)",
        edge: "rgba(113, 128, 245, 0.35)",
        hi:   "oklch(0.74 0.16 270)"
      },
      blue: {
        base: "#3D9EFF", dim: "#1F62C2",
        soft: "rgba(61, 158, 255, 0.12)",
        edge: "rgba(61, 158, 255, 0.36)",
        hi:   "oklch(0.74 0.15 240)"
      },
      teal: {
        base: "#3CD7C4", dim: "#1E8E83",
        soft: "rgba(60, 215, 196, 0.12)",
        edge: "rgba(60, 215, 196, 0.36)",
        hi:   "oklch(0.78 0.13 175)"
      },
      amber: {
        base: "#F5B86B", dim: "#9C6A2A",
        soft: "rgba(245, 184, 107, 0.12)",
        edge: "rgba(245, 184, 107, 0.36)",
        hi:   "oklch(0.82 0.13 75)"
      },
    };

    function applyAccent(name) {
      const a = ACCENTS[name] || ACCENTS.indigo;
      const r = document.documentElement.style;
      r.setProperty("--accent",       a.base);
      r.setProperty("--accent-dim",   a.dim);
      r.setProperty("--accent-soft",  a.soft);
      r.setProperty("--accent-edge",  a.edge);
    }

    const ACCENT_HEX = {
      "#7180F5": "indigo",
      "#3D9EFF": "blue",
      "#3CD7C4": "teal",
      "#F5B86B": "amber",
    };

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const accentName = ACCENT_HEX[t.accent] || t.accent;
      useEffect(() => applyAccent(accentName), [accentName]);

      return (
        <>
          <Dashboard
            initialDrawerIssue={t.showDrawer ? "ENG-142" : null}
            initialTab={t.initialTab}
          />
          <TweaksPanel title="Tweaks">
            <TweakSection label="Theme">
              <TweakColor
                label="Accent"
                value={t.accent}
                onChange={(v) => setTweak("accent", v)}
                options={["#7180F5", "#3D9EFF", "#3CD7C4", "#F5B86B"]}
              />
            </TweakSection>

            <TweakSection label="State">
              <TweakToggle
                label="Open spec drawer"
                value={t.showDrawer}
                onChange={(v) => setTweak("showDrawer", v)}
              />
              <TweakRadio
                label="Status tab"
                value={t.initialTab}
                onChange={(v) => setTweak("initialTab", v)}
                options={["Todo", "In Progress", "In Review", "Done"]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
